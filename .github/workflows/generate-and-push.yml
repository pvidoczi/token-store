name: Generate and Push Tokens to Angular Repo

on:
  push:
    paths:
      - 'foundation/**'
      - 'components/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Token Store
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'


      - name: Run token generation script
        run: |
          npx tsx parse_ids_css.ts

      - name: Checkout Angular Test Site
        uses: actions/checkout@v4
        with:
          repository: '${{ github.repository_owner }}/token-test-site'
          token: ${{ secrets.TARGET_REPO_TOKEN }}
          path: 'angular-target-repo'

      - name: Copy generated CSS to Angular project
        run: |
          mkdir -p angular-target-repo/src/assets/ids_css/
          cp -r ids_css/* angular-target-repo/src/assets/ids_css/

      - name: Commit and Push to Angular Repo
        run: |
          cd angular-target-repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "no changes to commit"
          else
            git commit -m "Automated token CSS update from Token Store"
            git push origin main
          fi
