name: Generate and publish token CSS

on:
  push:
    paths:
      - 'foundation/**/*.json'
      - 'components/**/*.json'
      - 'parse_ids_css.ts'
      - 'scripts/publish-css.sh'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Parse Figma JSON and push CSS to GitLab
        env:
          TARGET_REPO_URL: ${{ secrets.TARGET_REPO_URL }}
          TARGET_REPO_BRANCH: ${{ vars.TARGET_REPO_BRANCH }}
          TARGET_CSS_PATH: ${{ vars.TARGET_CSS_PATH }}
          GIT_AUTHOR_NAME: token-pipeline
          GIT_AUTHOR_EMAIL: token-pipeline@example.invalid
        run: npm run publish
